<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Реестр документов</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F7F6F4; }
    #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #fallback {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px;
      font: 13px/1.4 system-ui, sans-serif; color: #6B6862; text-align: center;
      background: rgba(255,255,255,0.9);
    }
    #fallback a { color: #2F6FE4; }
  </style>
</head>
<body>
  <!-- ЗАМЕНИ адрес ниже на свой Web app URL из Apps Script (…/exec) в ДВУХ местах -->
  <iframe id="frame"
          src="https://script.google.com/macros/s/AKfycbxDrEg4BKD1dD9o3weKXSqavF84EIce7Qiacbj0SETk2T1kIUHfO-U8OSewFto7aILz/exec"
          allow="clipboard-read; clipboard-write; fullscreen"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="fallback">
    Если что-то не открылось —
    <a href="https://script.google.com/macros/s/AKfycbxDrEg4BKD1dD9o3weKXSqavF84EIce7Qiacbj0SETk2T1kIUHfO-U8OSewFto7aILz/exec" target="_blank" rel="noopener">открыть в отдельной вкладке</a>
  </div>
</body>
</html>
